<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Proper mobile viewport with safe-area support for Capacitor/notched devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA / iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Life OS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Theme color (matches dark theme bg) -->
    <meta name="theme-color" content="#0a0a0a" id="theme-color-meta" />
    <!-- Prevent phone number detection -->
    <meta name="format-detection" content="telephone=no" />
    <title>Life OS</title>
    <!-- Google Fonts — preconnect for faster DNS resolution -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Plus Jakarta Sans (display/headings), Inter (body), JetBrains Mono (code) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script>
      (function() {
        var theme = localStorage.getItem('lifeos-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        // Update theme-color meta to match
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.content = theme === 'light' ? '#fcfbfa' : '#0a0a0a';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
