name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Code ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node 22 ────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # ── 3. Env vars ────────────────────────────────────────────────────
      - name: Write .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"           >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }}"   >> .env

      # ── 4. Supabase types (optional) ────────────────────────────────────
      # Regenerates src/types/database.ts from the live schema so the typed
      # Supabase client never drifts from reality.
      # Enable by adding SUPABASE_PROJECT_ID to GitHub repo secrets.
      # continue-on-error: true means a missing secret never breaks the build.
      - name: Regenerate Supabase types
        # secrets context is not available in `if:` expressions — expose as env var first
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        if: ${{ env.SUPABASE_PROJECT_ID != '' }}
        run: |
          npx supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            --schema public \
            > src/types/database.ts
        continue-on-error: true

      # ── 5. Web build ───────────────────────────────────────────────────
      - name: Build web app (Vite)
        run: npm run build

      # ── 6. Java ────────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ── 7. Android SDK ─────────────────────────────────────────────────
      - name: Install Android SDK 36 + build-tools
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ── 8. Decode keystore ─────────────────────────────────────────────
      # Decodes the committed base64 keystore and writes keystore.properties.
      # The same keystore is used on every build → consistent APK signature
      # → installs over older versions without uninstalling.
      - name: Set up signing keystore
        run: |
          base64 -d android/lifeos.keystore.b64 > android/lifeos.jks
          cat > android/keystore.properties << 'EOF'
          storeFile=../lifeos.jks
          storePassword=lifeos2026
          keyAlias=lifeos
          keyPassword=lifeos2026
          EOF

      # ── 9. Capacitor sync ─────────────────────────────────────────────
      - name: Sync Capacitor → Android
        run: npx cap sync android

      # ── 10. Build APK ──────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew assembleDebug --no-daemon

      # ── 11. Upload artifact ───────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: life-os-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
