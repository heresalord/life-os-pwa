name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a build manually from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Code ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node ────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # ── 3. Env vars ────────────────────────────────────────────────────
      # These come from GitHub → Settings → Secrets and variables → Actions
      - name: Write .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"             >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"   >> .env
          echo "VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }}"     >> .env

      # ── 4. Web build ───────────────────────────────────────────────────
      - name: Build web app (Vite)
        run: npm run build

      # ── 5. Java ────────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ── 6. Android SDK ────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 7. Capacitor sync ─────────────────────────────────────────────
      - name: Sync Capacitor → Android
        run: npx cap sync android

      # ── 8. Build APK ──────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── 9. Upload artifact ────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: life-os-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
